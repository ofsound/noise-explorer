name: Noise Explorer
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: noise-explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -B Builds -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNOISE_EXPLORER_COPY_PLUGINS=OFF
      - name: Build all formats
        run: cmake --build Builds --parallel 3
      - name: Test
        run: ctest --test-dir Builds --output-on-failure
      - name: Archive development builds
        run: ditto -c -k --keepParent Builds/NoiseExplorer_artefacts/Debug NoiseExplorer-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: NoiseExplorer-macOS-Debug
          path: NoiseExplorer-macOS.zip
# Development CI only: no IPP, publishing, certificates or notarization.
